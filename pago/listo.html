<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Volviendo a DondeBailar</title>
<style>
  :root {
    --fondo: #0C0C10; --texto: #F2F2F5; --texto-2: #B9B9C4; --texto-3: #8E8E9A; --borde: #26262F;
    --acento: #FF5A66; --oro: #F5B935;
    --papel: #F2EEE6; --tinta: #16161D; --tinta-2: #4A4A55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo); color: var(--texto);
    font-family: "Nunito Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh; min-height: 100dvh;
  }
  .pagina {
    max-width: 420px; min-height: 100vh; min-height: 100dvh; margin: 0 auto;
    padding: max(40px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 28px;
  }
  .marca { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .marca b { font-family: Nunito, "Segoe UI", system-ui, sans-serif; font-weight: 900; font-size: 30px; letter-spacing: -0.5px; }
  .marca b span { color: var(--acento); }
  .marca i { width: 120px; height: 3px; border-radius: 3px; background: var(--oro); }
  .entrada { margin-top: 8px; background: var(--papel); color: var(--tinta); border-radius: 18px; overflow: hidden; }
  .entrada .arriba { padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 8px; }
  h1 { margin: 0; font-family: Nunito, "Segoe UI", system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15; text-wrap: balance; }
  .acciones[hidden] { display: none; }
  .entrada p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--tinta-2); }
  .acciones { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .boton {
    display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px;
    background: var(--acento); color: var(--fondo); font-weight: 800; font-size: 17px; text-decoration: none;
  }
  .boton:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }
  .ayuda { margin: 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--texto-3); }
</style>
</head>
<body>
<main class="pagina">
  <div class="marca" aria-label="DondeBailar"><b>Donde<span>Bailar</span></b><i aria-hidden="true"></i></div>

  <section class="entrada" aria-labelledby="titulo">
    <div class="arriba">
      <h1 id="titulo" role="status">Volviendo a DondeBailar…</h1>
      <p lang="en">Returning to DondeBailar…</p>
    </div>
  </section>

  <div class="acciones" id="acciones" hidden>
    <a class="boton" href="dondebailar://">Abrir DondeBailar</a>
    <p class="ayuda">Si no se abre, abrí la app DondeBailar desde tu teléfono.<br><span lang="en">If it doesn't open, open the DondeBailar app on your phone.</span></p>
  </div>
  <noscript>
    <div class="acciones">
      <a class="boton" href="dondebailar://">Abrir DondeBailar</a>
      <p class="ayuda">Si no se abre, abrí la app DondeBailar desde tu teléfono.<br><span lang="en">If it doesn't open, open the DondeBailar app on your phone.</span></p>
    </div>
  </noscript>
</main>
<script>
(function () {
  var RUTA = "pago/listo";
  var ua = (navigator.userAgent || "");
  var url = /Android/i.test(ua)
    ? "intent://" + RUTA + "#Intent;scheme=dondebailar;package=cr.dondebailar.app;end"
    : "dondebailar://" + RUTA;
  window.location.assign(url);
  setTimeout(function () {
    if (document.visibilityState === "visible") {
      document.getElementById("acciones").hidden = false;
    }
  }, 1500);
})();
</script>
</body>
</html>
